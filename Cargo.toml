[package]
name = "vcs-rust"
version = "0.3.0"
edition = "2021"
description = "Experimental native Rust VCS PS2 textured world and static collision viewer"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
minifb = "0.28.0"

[profile.release]
opt-level = 3

